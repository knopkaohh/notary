<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Афиша A4 — запись</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      @page {
        size: A4;
        margin: 0;
      }

      .sheet {
        display: flex;
        flex-direction: column;
      }

      .hero {
        height: 188mm;
        position: relative;
      }

      .hero img {
        object-position: 50% 40%;
      }

      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgb(23 18 16 / 8%) 0%,
          rgb(23 18 16 / 0%) 35%,
          rgb(23 18 16 / 55%) 100%
        );
      }

      .hero-copy {
        position: absolute;
        left: 16mm;
        right: 16mm;
        bottom: 12mm;
        color: var(--gold-soft);
      }

      .eyebrow {
        font-size: 9pt;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .hero h1 {
        margin-top: 3mm;
        font-size: 38pt;
        line-height: 0.96;
        color: #f7f0e4;
      }

      .rest {
        flex: 1;
        padding: 8mm 16mm 12mm;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 6mm;
      }

      .line {
        font-size: 13pt;
        line-height: 1.4;
        color: var(--muted);
        max-width: 150mm;
      }

      .cta {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8mm;
        padding: 7mm 8mm;
      }

      .phone {
        font-size: 26pt;
        line-height: 1;
      }

      .cta p {
        margin-top: 2mm;
        font-size: 10pt;
        color: rgb(232 215 184 / 78%);
      }

      .qr {
        width: 24mm;
        height: 24mm;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <section class="sheet a4 paper">
      <div class="hero">
        <img class="bleed-img" src="./img/print-empty-room.png" alt="" />
        <div class="veil"></div>
        <div class="hero-copy">
          <p class="eyebrow">Нотариус у метро Динамо</p>
          <h1>Запишитесь.<br />Приедете без очереди.</h1>
        </div>
      </div>
      <div class="rest">
        <p class="line">
          Доверенность, согласие, сделка или доли ООО — сначала звонок, потом
          визит в БЦ «Монарх». Подскажем, что взять с собой.
        </p>
        <div class="cta">
          <div>
            <div class="phone">+7 (495) 690-96-00</div>
            <p>Давыдова Евгения Петровна · Пн–Пт 10:00–18:00 · 29 этаж</p>
          </div>
          <div class="qr">
            <img src="./qr-site-gold.svg" alt="" />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
